%YAML:1.0

# Use the supported legacy settings reader for already rectified stereo images.
# File.version 1.0 + Rectified crashes in upstream Settings::operator<<
# because originalCalib2_ is not initialized. Do not add File.version here.
Camera.type: "PinHole"

# Rectified intrinsics; zero distortion. TrackStereo performs no remapping.
Camera.fx: 412.45037841796875
Camera.fy: 412.45037841796875
Camera.cx: 422.34375
Camera.cy: 241.32501220703125

# bf = fx * baseline (baseline from raw TF: 0.0507745018 m).
Camera.bf: 20.94196248140564
Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0

# Camera resolution
Camera.width: 848
Camera.height: 480

# Camera frames per second 
Camera.fps: 30

# Grayscale IR, this parameter is effectively ignored
Camera.RGB: 0

# Close/Far threshold. Baseline times.
ThDepth: 40.0

# ORB parameters - initially keep D435i defaults
ORBextractor.nFeatures: 1250
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

# Viewer
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
